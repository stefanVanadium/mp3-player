; Firmware for the retro MP3 player (ESP32-PICO-MINI-02-N8R2).
; Build:   pio run              Flash: pio run -t upload       Monitor: pio device monitor
; Before the first flash of a new board, burn the flash-voltage eFuse (see ../code.md).

[platformio]
default_envs = player

[env]
; Arduino-ESP32 3.x (ESP-IDF 5) via the pioarduino platform
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
; Pinned to the commits this was last built with (2026-11-20)
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#1f1f0de
    https://github.com/pschatzmann/ESP32-A2DP.git#89f3842
    https://github.com/pschatzmann/arduino-libhelix.git#f6e55a3
    https://github.com/pschatzmann/arduino-libfoxenflac.git#79042f3
    adafruit/Adafruit SHARP Memory Display@1.1.4
    adafruit/Adafruit GFX Library@1.13.0

; The music player
[env:player]

; Bring-up firmware: serial menu that tests one block at a time (code.md, mp3_player.md "Bring-up")
[env:bringup]
build_flags =
    ${env.build_flags}
    -DBRINGUP
